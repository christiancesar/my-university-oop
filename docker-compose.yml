version: '3.8'
services:
  database:
    container_name: database-university-with-docker-compose
    image: bitnami/postgresql:latest
    environment:
      - POSTGRESQL_USERNAME=admin
      - POSTGRESQL_PASSWORD=12345678
      - POSTGRESQL_DATABASE=university
    ports:
      - '5432:5432'
    # volumes:
    #   - 'postgresql_data:/bitnami/postgresql'
